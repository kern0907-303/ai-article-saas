services:
  - type: web
    name: ai-article-saas-backend
    env: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: ai-article-saas-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: RENDER_DISK_PATH
        value: /var/data
      - key: DATABASE_URL
        value: sqlite:////var/data/ai-article-saas/app.db
      - key: STORAGE_DIR
        value: /var/data/ai-article-saas/storage
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AUTH_ENABLED
        value: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ENCRYPTION_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: REQUIRE_PERSISTENT_DATABASE
        value: true
      - key: CORS_ORIGINS
        sync: false
      - key: PCLOUD_AUTH_TOKEN
        sync: false
      - key: PCLOUD_API_HOST
        value: api.pcloud.com
      - key: PCLOUD_FOLDER_ID
        sync: false
      - key: PCLOUD_FOLDER_PATH
        sync: false
      - key: PCLOUD_PUBLIC_FOLDER_PATH
        sync: false
      - key: PCLOUD_PUBLIC_BASE_URL
        sync: false
      - key: PCLOUD_CREATE_PUBLIC_LINK
        value: true
      - key: PCLOUD_USE_DIRECT_DOWNLOAD_LINK
        value: true
